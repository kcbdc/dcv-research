name: DCV research compute
on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dcv-research-production
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compute and resume research jobs
        run: node scripts/actions-runner.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          OPENFISCAL_API_KEY: ${{ secrets.OPENFISCAL_API_KEY }}
          BOJO_API_KEY: ${{ secrets.BOJO_API_KEY }}
          FDIC_API_KEY: ${{ secrets.FDIC_API_KEY }}
